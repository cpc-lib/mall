# Seata Server（TC）配置，发布到 Nacos：dataId=seataServer.properties，group=SEATA_GROUP。
# 存储使用 DB 模式，库为 compose 内的 DM8；对应表在 backend/env/sql/dm8/schema.sql：
# global_table / branch_table / lock_table / distributed_lock。
# 键名必须是 Seata 2.x ConfigurationKeys 里的 camelCase 形式（store.db.driverClassName 等），
# 写成 store.db.driver-class-name 会被静默忽略并在启动时报 "store.db.driverClassName can't be empty"。
store.mode=db

store.db.datasource=druid
store.db.dbType=dm
store.db.driverClassName=dm.jdbc.driver.DmDriver
store.db.url=jdbc:dm://dm8:5236?schema=SYSDBA
store.db.user=SYSDBA
store.db.password=Cpc2026#@Dm
store.db.minConn=10
store.db.maxConn=100
store.db.globalTable=global_table
store.db.branchTable=branch_table
store.db.lockTable=lock_table
store.db.distributedLockTable=distributed_lock
store.db.queryLimit=1000
store.db.maxWait=5000
