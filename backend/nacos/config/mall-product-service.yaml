server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: mall-product-service
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  datasource:
    driver-class-name: dm.jdbc.driver.DmDriver
    url: jdbc:dm://${DM_HOST:127.0.0.1}:${DM_PORT:5236}?schema=${DM_SCHEMA:SYSDBA}&connectTimeout=30000&socketTimeout=60000
    username: ${DM_USERNAME:SYSDBA}
    password: ${DM_PASSWORD:Cpc2026#@Dm}

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  mapper-locations: classpath:mapper/*.xml

# Excel 导入文件存储（V6）：storage=local 落本地 dir 目录；storage=minio 走 MinIO 对象存储
stock:
  import:
    storage: ${STOCK_IMPORT_STORAGE:minio}
    dir: ${STOCK_IMPORT_DIR:D:/release/payment-demo-java-dm/upload}
    minio:
      endpoint: ${STOCK_IMPORT_MINIO_ENDPOINT:http://192.168.1.200:39000}
      access-key: ${STOCK_IMPORT_MINIO_ACCESS_KEY:admin}
      secret-key: ${STOCK_IMPORT_MINIO_SECRET_KEY:hjm029796}
      bucket: ${STOCK_IMPORT_MINIO_BUCKET:payment-demo}

logging:
  level:
    root: info
