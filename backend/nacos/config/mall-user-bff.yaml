server:
  # 用户端 BFF：8080 由 mall-gateway 占用，本进程只接受网关转发
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: mall-user-bff
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 3000
            read-timeout: 10000
          mall-product-service:
            connect-timeout: 3000
            read-timeout: 30000
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  # BFF 为无状态进程：不连接数据库、Redis 与 RabbitMQ，故不包含 datasource / redis / rabbitmq / mybatis-plus 配置。

logging:
  level:
    root: info

# Nacos 关闭时 BFF 通过 Feign 直连各领域服务；Nacos 开启时使用 lb:// 服务名，base-url 留空即可。
user:
  service:
    base-url: ${USER_SERVICE_BASE_URL:}

cart:
  service:
    base-url: ${CART_SERVICE_BASE_URL:}

product:
  service:
    base-url: ${PRODUCT_SERVICE_BASE_URL:}
