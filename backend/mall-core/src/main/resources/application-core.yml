# mall-core 领域内核共享配置：由各 BFF 通过 spring.config.import 引入。
# BFF 为无状态进程：不连接数据库、Redis 与 RabbitMQ，因此本文件不再包含 datasource / redis / rabbitmq / mybatis-plus 配置。
# 端口与 spring.application.name 属于进程级配置，保留在各 BFF 的 application.yml。
spring:
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

logging:
  level:
    root: info

# Nacos 关闭时 BFF 通过 Feign 直连各领域服务；Nacos 开启时使用 lb:// 服务名，base-url 留空即可。
user:
  service:
    base-url: ${USER_SERVICE_BASE_URL:}

cart:
  service:
    base-url: ${CART_SERVICE_BASE_URL:}

product:
  service:
    base-url: ${PRODUCT_SERVICE_BASE_URL:}
