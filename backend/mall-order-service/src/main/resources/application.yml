server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: mall-order-service
  config:
    import: optional:nacos:mall-order-service.yaml
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        enabled: ${NACOS_ENABLED:true}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
      config:
        enabled: ${NACOS_ENABLED:true}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        file-extension: yaml
        import-check:
          enabled: false
    openfeign:
      client:
        config:
          default:
            connect-timeout: 3000
            read-timeout: 10000
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:mall}
    password: ${RABBITMQ_PASSWORD:Cpc2026#@Mq}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        # 订单服务消费延迟关单与支付成功事件
        auto-startup: true
        acknowledge-mode: manual
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 4
          initial-interval: 1000
          multiplier: 2.0
          max-interval: 10000
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: 0
      timeout: 3000ms
      password: ${REDIS_PASSWORD:cpc!23#@}
  datasource:
    driver-class-name: dm.jdbc.driver.DmDriver
    url: jdbc:dm://${DM_HOST:127.0.0.1}:${DM_PORT:5236}?schema=${DM_SCHEMA:SYSDBA}&connectTimeout=30000
    username: ${DM_USERNAME:SYSDBA}
    password: ${DM_PASSWORD:Cpc2026#@Dm}

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath:mapper/*.xml

user:
  service:
    base-url: ${USER_SERVICE_BASE_URL:}

cart:
  service:
    base-url: ${CART_SERVICE_BASE_URL:}

product:
  service:
    base-url: ${PRODUCT_SERVICE_BASE_URL:}

payment:
  service:
    base-url: ${PAYMENT_SERVICE_BASE_URL:}
  order:
    expire-minutes: 3 # 本地订单未支付超时（分钟）：到时释放锁定库存并关单（MQ 延迟关单 TTL 与 DB 兜底判定共用此值）
    timeout-scan-ms: 60000 # DB 最终一致性兜底：扫描超时 NOTPAY 订单的周期

seata:
  enabled: ${SEATA_ENABLED:true}
  application-id: mall-order-service
  tx-service-group: ${SEATA_TX_GROUP:mall_tx_group}
  enable-auto-data-source-proxy: false # 仅用 Saga，不启用 AT，避免代理 DM8 数据源
  registry:
    # 通过 Nacos 发现 TC（服务名 seata-server，集群 default）
    type: nacos
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      application: seata-server
      group: SEATA_GROUP
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
  service:
    vgroup-mapping:
      mall_tx_group: default
  saga:
    enabled: ${SEATA_SAGA_ENABLED:true}

order:
  request:
    ttl-hours: 24 # 下单幂等记录保留时长
    clean-scan-ms: 60000 # 清理下单幂等记录的扫描周期

logistics:
  mock:
    advance-ms: 15000

local-message:
  relay-enabled: false # 同库阶段由 user-bff 统一中继 Outbox，避免双发布

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://127.0.0.1:9411/api/v2/spans}

logging:
  level:
    root: info
  logstash:
    destination: ${LOGSTASH_DESTINATION:127.0.0.1:5000}
