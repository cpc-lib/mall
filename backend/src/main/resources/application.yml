server:
  port: 8080 #服务端口

spring:
  application:
    name: payment-demo #应用的名字

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

  rabbitmq:
    host: 192.168.1.200
    port: 5672
    username: guest
    password: guest
    publisher-confirm-type: correlated # 发送者确认：异步回调确认消息到达交换机（回调见 RabbitReliabilityConfig）
    publisher-returns: true # 消息不可路由到队列时退回发送者（配合 template.mandatory）
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual # 消费者手动确认：业务处理 + markConsumed 成功后 basicAck；异常继续抛给 Spring Retry，耗尽后 reject 进入 Failure DLQ
        retry:
          enabled: true # 消费异常指数回避重试：2s→6s→18s，共 4 次后放弃
          max-attempts: 4
          initial-interval: 2000
          multiplier: 3.0
          max-interval: 20000
        default-requeue-rejected: false # 重试耗尽后 reject；release queue 通过 DLX 进入独立 failure queue，不回原队列；DB 兜底任务继续负责业务最终收敛

  redis:
    host: 192.168.1.200
    port: 6379
    database: 0
    timeout: 3000ms
    password: cpc!23#@

  datasource:
    # 达梦 DM8：默认由 docker-compose.dm8.yml 暴露到本机 5236
    driver-class-name: dm.jdbc.driver.DmDriver
    url: jdbc:dm://${DM_HOST:192.168.1.200}:${DM_PORT:5236}?schema=${DM_SCHEMA:SYSDBA}&connectTimeout=30000
    username: ${DM_USERNAME:SYSDBA}
    password: ${DM_PASSWORD:Cpc2026#@Dm}

mybatis-plus:
  configuration: #sql日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath:mapper/*.xml

logging:
  level:
    root: info


payment:
  auth:
    access-ttl-seconds: 1800
    refresh-ttl-seconds: 604800
    jwt-secret: ${AUTH_JWT_SECRET:1SloQ0WmJUmNWiqvNOPco016eVlkYAskLrJE2FJ}
  order:
    expire-minutes: 3 # 本地订单未支付超时（分钟）：到时释放锁定库存并关单（MQ 延迟关单 TTL 与 DB 兜底判定共用此值）
    timeout-scan-ms: 60000 # DB 最终一致性兜底：扫描超时 NOTPAY 订单的周期
  refund:
    status-sync-delay-ms: 60000 # MQ 退款状态同步延迟
    status-sync-scan-ms: 60000 # DB 最终一致性兜底：扫描 APPROVED + PROCESSING 退款的周期

# Excel 导入文件存储（V6）：storage=local 落本地 dir 目录；storage=minio 走 MinIO 对象存储
stock:
  import:
    storage: minio # local-本地磁盘（默认）/ minio-对象存储
    dir: D:/release/payment-demo-java-dm/upload # storage=local 时 Excel 保存目录（绝对路径或相对后端启动工作目录）
    minio: # storage=minio 时生效
      endpoint: ${STOCK_IMPORT_MINIO_ENDPOINT:http://192.168.1.200:39000}
      access-key: ${STOCK_IMPORT_MINIO_ACCESS_KEY:admin}
      secret-key: ${STOCK_IMPORT_MINIO_SECRET_KEY:hjm029796}
      bucket: ${STOCK_IMPORT_MINIO_BUCKET:payment-demo}

