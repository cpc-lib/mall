# Seata Server（TC）2.6.0 引导配置：该镜像不含 Web 控制台，也没有 SEATA_PORT/STORE_MODE 环境变量。
# 本文件只保留服务端口、进程形态、日志与 Nacos 配置/注册中心连接；存储（DB 模式 + DM8 数据源）配置在
# Nacos 的 Data ID seataServer.properties（group SEATA_GROUP），仓库镜像见 backend/nacos/config/seataServer.properties。
# 对应表：backend/env/sql/dm8/schema.sql 中的 global_table / branch_table / lock_table / distributed_lock。
server:
  port: 8091

spring:
  application:
    name: seata-server
  main:
    web-application-type: none

logging:
  config: classpath:logback-spring.xml
  file:
    path: ${log.home:${user.home}/logs/seata}
  extend:
    logstash-appender:
      enabled: false
      destination: 127.0.0.1:4560
    kafka-appender:
      enabled: false
      bootstrap-servers: 127.0.0.1:9092
      topic: logback_to_logstash
    metric-appender:
      enabled: false

seata:
  # 配置中心：store（DB + DM8 数据源）等内容取自 Nacos 的 seataServer.properties
  config:
    type: nacos
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:nacos:8848}
      group: SEATA_GROUP
      data-id: seataServer.properties
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
  # 注册中心：TC 以 seata-server 注册到 Nacos，客户端按 vgroup-mapping 的 default 集群发现
  registry:
    type: nacos
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:nacos:8848}
      group: SEATA_GROUP
      application: seata-server
      cluster: default
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
