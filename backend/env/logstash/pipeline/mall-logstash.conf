# 应用侧由 logback-spring.xml 的 LogstashTcpSocketAppender 输出 JSON 行，
# 这里按行接收后写入 Elasticsearch 的按天索引。
input {
  tcp {
    port => 5000
    codec => json_lines
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "mall-logs-%{+YYYY.MM.dd}"
    data_stream => false
  }
}
