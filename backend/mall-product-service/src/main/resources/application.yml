server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: mall-product-service
  config:
    import: optional:nacos:mall-common.yaml,optional:nacos:mall-product-service.yaml
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        enabled: ${NACOS_ENABLED:true}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
      config:
        enabled: ${NACOS_ENABLED:true}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        file-extension: yaml
        import-check:
          enabled: false
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  datasource:
    driver-class-name: dm.jdbc.driver.DmDriver
    url: jdbc:dm://${DM_HOST:127.0.0.1}:${DM_PORT:5236}?schema=${DM_SCHEMA:SYSDBA}&connectTimeout=30000
    username: ${DM_USERNAME:SYSDBA}
    password: ${DM_PASSWORD:Cpc2026#@Dm}

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath:mapper/*.xml

# Excel 导入文件存储（V6）：storage=local 落本地 dir 目录；storage=minio 走 MinIO 对象存储
stock:
  import:
    storage: ${STOCK_IMPORT_STORAGE:minio}
    dir: ${STOCK_IMPORT_DIR:D:/release/payment-demo-java-dm/upload}
    minio:
      endpoint: ${STOCK_IMPORT_MINIO_ENDPOINT:http://192.168.1.200:39000}
      access-key: ${STOCK_IMPORT_MINIO_ACCESS_KEY:admin}
      secret-key: ${STOCK_IMPORT_MINIO_SECRET_KEY:hjm029796}
      bucket: ${STOCK_IMPORT_MINIO_BUCKET:payment-demo}

internal:
  service:
    # 不提供默认内部凭据；未配置时所有 internal 请求均失败关闭。
    token: ${INTERNAL_SERVICE_TOKEN:}

logging:
  level:
    root: info
