server:
  # 管理端 BFF：8080 由 mall-gateway 占用，本进程只接受网关转发
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: mall-admin-bff
  config:
    import: classpath:application-core.yml,optional:nacos:mall-admin-bff.yaml
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        enabled: ${NACOS_ENABLED:true}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
      config:
        enabled: ${NACOS_ENABLED:true}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        file-extension: yaml
        import-check:
          enabled: false
    openfeign:
      client:
        config:
          default:
            connect-timeout: 3000
            read-timeout: 10000
          mall-product-service:
            connect-timeout: 3000
            read-timeout: 30000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://127.0.0.1:9411/api/v2/spans}

logging:
  level:
    root: info
  logstash:
    destination: ${LOGSTASH_DESTINATION:127.0.0.1:5000}
